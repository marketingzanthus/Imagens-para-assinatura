name: PostgreSQL migration checks
on:
  push:
    branches: [migration/postgresql, sorteador-online]
  pull_request:
    branches: [sorteador-online]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sorteador_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tests/test_postgres.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/sorteador_test
